name: CI image

on:
  pull_request:
    paths:
      - docker/ci.Dockerfile
      - .github/workflows/ci-image.yml
      - .github/scripts/install-llvm.sh
      - .github/scripts/check-ci-image.sh
      - CMakeLists.txt
      - cmake/**
      - third_party/**
      - tools/**
      - .clang-format
      - .clang-tidy
  workflow_dispatch:
  schedule:
    - cron: "41 7 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: LLVM 21 image / build, tests, and full lint
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: plinth
          POSTGRES_PASSWORD: plinth
          POSTGRES_DB: plinth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plinth -d plinth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

      - name: Build the CI image locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: docker
          file: docker/ci.Dockerfile
          tags: plinth-ci-check:local
          pull: true
          load: true
          cache-from: type=gha,scope=ci-image
          # Nightly and manual runs on main refresh the cache; all others only read it.
          cache-to: ${{ github.ref == 'refs/heads/main' && contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name) && 'type=gha,mode=max,scope=ci-image' || '' }}

      - name: Build, test, format, and lint inside the image
        env:
          PLINTH_PG_HOST: 127.0.0.1
          PLINTH_PG_PORT: "5432"
          PLINTH_PG_USER: plinth
          PLINTH_PG_PASSWORD: plinth
          PLINTH_PG_DATABASE: plinth_test
        run: |
          docker run --rm --network host \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work,readonly" \
            --workdir /work \
            --env PLINTH_PG_HOST --env PLINTH_PG_PORT \
            --env PLINTH_PG_USER --env PLINTH_PG_PASSWORD --env PLINTH_PG_DATABASE \
            plinth-ci-check:local bash -euc \
            'git config --global --add safe.directory /work; exec bash .github/scripts/check-ci-image.sh'

  nightly_failure_tracking:
    name: CI image / nightly failure tracking
    needs: [validate]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    # Serialize both workflows' updates so overlapping failures share one issue.
    concurrency:
      group: nightly-ci-failure-issue
      cancel-in-progress: false
    steps:
      - name: Track failed or cancelled nightly jobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          ISSUE_TITLE: Nightly CI failure
          ISSUE_SEARCH: 'in:title "Nightly CI failure"'
        shell: bash
        run: |
          set -euo pipefail
          failed_jobs=$(jq -r 'to_entries[] |
            select(.value.result == "failure" or .value.result == "cancelled") |
            "- \(.key): \(.value.result)"' <<<"$NEEDS_JSON")
          if [[ -z "$failed_jobs" ]]; then
            exit 0
          fi

          body_file=$(mktemp)
          trap 'rm -f -- "$body_file"' EXIT
          printf '[Engine Lead]\nWorkflow: %s\nRun: %s\nSHA: %s\n\nFailed jobs:\n%s\n' \
            "$WORKFLOW_NAME" "$RUN_URL" "$RUN_SHA" "$failed_jobs" > "$body_file"
          issue_number=$(gh issue list --search "$ISSUE_SEARCH" --state open --limit 100 \
            --json number,title | jq -r --arg title "$ISSUE_TITLE" '
              [.[] | select(.title == $title)] | sort_by(.number) |
              first | .number // empty')
          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --body-file "$body_file"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file "$body_file"
          fi
