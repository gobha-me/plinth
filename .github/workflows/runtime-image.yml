name: Runtime image

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release must reach a terminal result. Superseded branch and PR builds may
  # be cancelled, but a tag publication must never be interrupted halfway.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  REGISTRY_IMAGE: ghcr.io/gobha-me/plinth

jobs:
  candidate:
    name: ${{ matrix.arch }} / build and test without publication
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            browser: true
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            browser: false
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: plinth
          POSTGRES_PASSWORD: plinth
          POSTGRES_DB: plinth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plinth -d plinth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Derive reproducible build inputs
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          revision=$(git rev-parse HEAD)
          source_date_epoch=$(git show -s --format=%ct HEAD)
          {
            echo "PLINTH_IMAGE_VERSION=$version"
            echo "PLINTH_IMAGE_REVISION=$revision"
            echo "PLINTH_SOURCE_DATE_EPOCH=$source_date_epoch"
          } >> "$GITHUB_ENV"

      - name: Install runtime verification dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client python3-yaml

      - name: Verify container exit event matching
        run: python3 tests/deployment/containerd_exit_event_test.py

      - name: Verify the effective Docker context policy
        run: python3 tests/tools/docker_context_test.py

      - name: Build the server test image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --platform "${{ matrix.platform }}" \
            --target server-tests \
            --build-arg "PLINTH_VERSION=$PLINTH_IMAGE_VERSION" \
            --build-arg "PLINTH_REVISION=$PLINTH_IMAGE_REVISION" \
            --build-arg "SOURCE_DATE_EPOCH=$PLINTH_SOURCE_DATE_EPOCH" \
            --build-arg PLINTH_RELEASE=0 \
            --tag "plinth-server-tests:${{ matrix.arch }}-$GITHUB_RUN_ID" \
            --file docker/Dockerfile .

      - name: Run the full server test surface
        env:
          PLINTH_PG_HOST: 127.0.0.1
          PLINTH_PG_PORT: "5432"
          PLINTH_PG_USER: plinth
          PLINTH_PG_PASSWORD: plinth
          PLINTH_PG_DATABASE: plinth_test
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            --env PLINTH_PG_HOST --env PLINTH_PG_PORT \
            --env PLINTH_PG_USER --env PLINTH_PG_PASSWORD \
            --env PLINTH_PG_DATABASE \
            "plinth-server-tests:${{ matrix.arch }}-$GITHUB_RUN_ID"

      - name: Build the runtime image without pushing
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --platform "${{ matrix.platform }}" \
            --target runtime \
            --build-arg "PLINTH_VERSION=$PLINTH_IMAGE_VERSION" \
            --build-arg "PLINTH_REVISION=$PLINTH_IMAGE_REVISION" \
            --build-arg "SOURCE_DATE_EPOCH=$PLINTH_SOURCE_DATE_EPOCH" \
            --build-arg PLINTH_RELEASE=0 \
            --label "org.opencontainers.image.version=$PLINTH_IMAGE_VERSION" \
            --label "org.opencontainers.image.revision=$PLINTH_IMAGE_REVISION" \
            --tag "plinth-runtime:${{ matrix.arch }}-$GITHUB_RUN_ID" \
            --file docker/Dockerfile .

      - name: Verify the constructed runtime image
        env:
          PLINTH_EXPECTED_ARCH: ${{ matrix.arch }}
          PLINTH_EXPECTED_RELEASE: "0"
          PLINTH_PG_HOST: 127.0.0.1
          PLINTH_PG_PORT: "5432"
          PLINTH_PG_USER: plinth
          PLINTH_PG_PASSWORD: plinth
          PLINTH_PG_DATABASE: plinth_test
        run: >-
          .github/scripts/check-runtime-image.sh
          "plinth-runtime:${{ matrix.arch }}-$GITHUB_RUN_ID"
          "$PLINTH_IMAGE_VERSION"
          "$PLINTH_IMAGE_REVISION"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ matrix.browser }}
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Install the production browser
        if: ${{ matrix.browser }}
        run: |
          npm ci --prefix tests/browser
          (cd tests/browser && npx playwright install --with-deps chromium)

      - name: Exercise the browser and retained upgrade journeys against the image
        if: ${{ matrix.browser }}
        env:
          PLINTH_PG_HOST: 127.0.0.1
          PLINTH_PG_PORT: "5432"
          PLINTH_PG_USER: plinth
          PLINTH_PG_PASSWORD: plinth
          PLINTH_PG_DATABASE: plinth_test
        run: |
          set -euo pipefail
          image="plinth-runtime:${{ matrix.arch }}-$GITHUB_RUN_ID"
          npm run test:transport --prefix tests/browser
          npm run test:launcher --prefix tests/browser
          npm run test:launcher-browser --prefix tests/browser
          python3 tests/browser/process_cleanup_test.py
          python3 tests/browser/kernel_runtime_test.py
          python3 tests/browser/run-production.py --image "$image" --realtime
          python3 tests/browser/run-production.py --image "$image" --upgrade-cache
          python3 tests/browser/run-bundled-upgrade.py --image "$image"

      - name: Exercise the Kubernetes and Traefik lifecycle
        if: ${{ matrix.arch == 'amd64' }}
        env:
          PLINTH_DEPLOYMENT_TOOLS_DIR: /tmp/plinth-deployment-tools/bin
        run: |
          set -euo pipefail
          .github/scripts/install-deployment-tools.sh all
          export PATH="$PLINTH_DEPLOYMENT_TOOLS_DIR:$PATH"
          image="plinth-runtime:amd64-$GITHUB_RUN_ID"
          python3 tests/deployment/k3d_lifecycle_test.py --image "$image" --kubernetes min
          python3 tests/deployment/k3d_lifecycle_test.py --image "$image" --kubernetes max

      - name: Build the previous exact runtime revision for recovery validation
        if: ${{ matrix.arch == 'amd64' }}
        shell: bash
        run: |
          set -euo pipefail
          # Use the newest prior stable tag once one exists. Tag ancestry alone
          # does not prove a published or attested runtime release. The
          # #109 fallback proves prerelease revision mechanics only; it is not
          # published-release upgrade or rollback evidence.
          current_revision=$(git rev-parse HEAD)
          previous_revision=
          previous_identity=
          while IFS= read -r release_tag; do
            [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            release_version=${release_tag#v}
            if [ "$(printf '%s\n' 0.6.6 "$release_version" | sort -V | head -n1)" != 0.6.6 ]; then
              continue
            fi
            release_revision=$(git rev-parse "$release_tag^{commit}")
            if [ "$release_revision" != "$current_revision" ]; then
              previous_revision=$release_revision
              previous_identity=$release_tag
              break
            fi
          done < <(git tag --merged HEAD --list 'v*' --sort=-v:refname)
          if [ -z "$previous_revision" ]; then
            previous_revision=253f6e1a3cdb89e13a7e9cff4330f0f950d01de6
            previous_identity='prerelease #109 fallback'
          fi
          echo "Recovery predecessor: $previous_identity ($previous_revision)"
          git merge-base --is-ancestor "$previous_revision" HEAD
          previous_source="$RUNNER_TEMP/plinth-previous-$GITHUB_RUN_ID"
          git worktree add --detach "$previous_source" "$previous_revision"
          previous_version=$(git show "$previous_revision:VERSION" | tr -d '\r\n')
          previous_epoch=$(git show -s --format=%ct "$previous_revision")
          docker build --pull --platform linux/amd64 \
            --target runtime \
            --build-arg "PLINTH_VERSION=$previous_version" \
            --build-arg "PLINTH_REVISION=$previous_revision" \
            --build-arg "SOURCE_DATE_EPOCH=$previous_epoch" \
            --build-arg PLINTH_RELEASE=0 \
            --label "org.opencontainers.image.version=$previous_version" \
            --label "org.opencontainers.image.revision=$previous_revision" \
            --tag "plinth-runtime:previous-$GITHUB_RUN_ID" \
            --file "$previous_source/docker/Dockerfile" "$previous_source"

      - name: Exercise matched backup, fresh restore, upgrade, rollback, and signals
        if: ${{ matrix.arch == 'amd64' }}
        env:
          PLINTH_DEPLOYMENT_TOOLS_DIR: /tmp/plinth-deployment-tools/bin
        run: |
          set -euo pipefail
          export PATH="$PLINTH_DEPLOYMENT_TOOLS_DIR:$PATH"
          python3 tests/deployment/k3d_recovery_test.py \
            --image "plinth-runtime:amd64-$GITHUB_RUN_ID" \
            --previous-image "plinth-runtime:previous-$GITHUB_RUN_ID" \
            --previous-chart "$RUNNER_TEMP/plinth-previous-$GITHUB_RUN_ID/deploy/helm/plinth" \
            --kubernetes max

  release_preflight:
    name: Validate immutable release identity
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
      source_date_epoch: ${{ steps.release.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the protected release approval gate
        env:
          PLINTH_RELEASE_APPROVAL_GATE: ${{ vars.PLINTH_RELEASE_APPROVAL_GATE }}
        shell: bash
        run: |
          if [[ $PLINTH_RELEASE_APPROVAL_GATE != configured ]]; then
            echo "release environment approval is not configured" >&2
            exit 1
          fi

      - name: Validate tag, VERSION, and main ancestry
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag=$GITHUB_REF_NAME
          if [[ ! $tag =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must be exactly vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          patch=${BASH_REMATCH[3]}
          if ((major == 0 && (minor < 6 || (minor == 6 && patch < 6)))); then
            echo "v0.6.6 is the first release eligible for a supported image" >&2
            exit 1
          fi

          version=${tag#v}
          recorded_version=$(tr -d '\r\n' < VERSION)
          if [[ $version != "$recorded_version" ]]; then
            echo "release tag $tag does not match VERSION $recorded_version" >&2
            exit 1
          fi

          revision=$(git rev-parse "$tag^{commit}")
          if [[ $revision != "$(git rev-parse HEAD)" ]]; then
            echo "checked-out commit does not match the release tag" >&2
            exit 1
          fi
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$revision" refs/remotes/origin/main; then
            echo "release tag commit is not reachable from origin/main" >&2
            exit 1
          fi

          for workflow in ci.yml codeql.yml; do
            response=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
              -f "head_sha=$revision" -f event=push \
              -f per_page=100)
            if ! jq -e --arg revision "$revision" '
              ([.workflow_runs[] |
                select(.head_sha == $revision and .event == "push")] |
                sort_by(.run_number) | last) as $run |
              $run != null and
              $run.status == "completed" and
              $run.conclusion == "success"
            ' <<<"$response" >/dev/null; then
              echo "$workflow has no terminal-success push run for $revision" >&2
              exit 1
            fi
          done

          source_date_epoch=$(git show -s --format=%ct "$revision")
          {
            echo "version=$version"
            echo "revision=$revision"
            echo "source_date_epoch=$source_date_epoch"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish immutable multi-architecture image
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: release_preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: plinth
          POSTGRES_PASSWORD: plinth
          POSTGRES_DB: plinth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plinth -d plinth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          image: tonistiigi/binfmt:qemu-v9.2.2@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install runtime verification dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Refuse an existing immutable version tag
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release_preflight.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          registry_token=$(
            printf 'user = "%s:%s"\n' "$GITHUB_ACTOR" "$GHCR_TOKEN" |
              curl --retry 3 --silent --show-error --fail --config - \
                "https://ghcr.io/token?service=ghcr.io&scope=repository:gobha-me/plinth:pull" |
              jq -er .token
          )
          status=$(curl --retry 3 --silent --show-error --output /tmp/manifest \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            --header "Authorization: Bearer $registry_token" \
            "https://ghcr.io/v2/gobha-me/plinth/manifests/v$VERSION")
          case "$status" in
            404) ;;
            200)
              echo "$REGISTRY_IMAGE:v$VERSION already exists; refusing to overwrite it" >&2
              exit 1
              ;;
            *)
              echo "registry returned HTTP $status while checking the release tag" >&2
              exit 1
              ;;
          esac

      - name: Build and push by digest only
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          build-args: |
            PLINTH_VERSION=${{ needs.release_preflight.outputs.version }}
            PLINTH_REVISION=${{ needs.release_preflight.outputs.revision }}
            SOURCE_DATE_EPOCH=${{ needs.release_preflight.outputs.source_date_epoch }}
            PLINTH_RELEASE=1
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release_preflight.outputs.version }}
            org.opencontainers.image.revision=${{ needs.release_preflight.outputs.revision }}

      - name: Verify both exact release architectures before naming the index
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLINTH_EXPECTED_RELEASE: "1"
          PLINTH_PG_HOST: 127.0.0.1
          PLINTH_PG_PORT: "5432"
          PLINTH_PG_USER: plinth
          PLINTH_PG_PASSWORD: plinth
          PLINTH_PG_DATABASE: plinth_test
          VERSION: ${{ needs.release_preflight.outputs.version }}
          REVISION: ${{ needs.release_preflight.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          image="$REGISTRY_IMAGE@$DIGEST"

          platforms=$(docker buildx imagetools inspect --raw "$image" |
            jq -c '[.manifests[].platform |
              select(.os != "unknown" and .architecture != "unknown") |
              (.os + "/" + .architecture +
                (if .variant then "/" + .variant else "" end))] | sort')
          if [[ $platforms != '["linux/amd64","linux/arm64"]' ]]; then
            echo "release index platforms are $platforms" >&2
            exit 1
          fi

          docker pull --platform linux/arm64 "$image"
          PLINTH_EXPECTED_ARCH=arm64 \
            .github/scripts/check-runtime-image.sh "$image" "$VERSION" "$REVISION"

          docker pull --platform linux/amd64 "$image"
          PLINTH_EXPECTED_ARCH=amd64 \
            .github/scripts/check-runtime-image.sh "$image" "$VERSION" "$REVISION"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Exercise production browser journeys against the exact digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLINTH_PG_HOST: 127.0.0.1
          PLINTH_PG_PORT: "5432"
          PLINTH_PG_USER: plinth
          PLINTH_PG_PASSWORD: plinth
          PLINTH_PG_DATABASE: plinth_test
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix tests/browser
          (cd tests/browser && npx playwright install --with-deps chromium)
          image="$REGISTRY_IMAGE@$DIGEST"
          python3 tests/browser/run-production.py --image "$image" --realtime
          python3 tests/browser/run-production.py --image "$image" --upgrade-cache
          python3 tests/browser/run-bundled-upgrade.py --image "$image"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest the dependency SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify attestations and publish the exact version tag
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release_preflight.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          digest_ref="$REGISTRY_IMAGE@$DIGEST"
          signer="$GITHUB_REPOSITORY/.github/workflows/runtime-image.yml"
          gh attestation verify "oci://$digest_ref" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA"
          gh attestation verify "oci://$digest_ref" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --predicate-type https://cyclonedx.org/bom

          registry_token=$(
            printf 'user = "%s:%s"\n' "$GITHUB_ACTOR" "$GHCR_TOKEN" |
              curl --retry 3 --silent --show-error --fail --config - \
                "https://ghcr.io/token?service=ghcr.io&scope=repository:gobha-me/plinth:pull" |
              jq -er .token
          )
          status=$(curl --retry 3 --silent --show-error --output /tmp/manifest \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            --header "Authorization: Bearer $registry_token" \
            "https://ghcr.io/v2/gobha-me/plinth/manifests/v$VERSION")
          if [[ $status != 404 ]]; then
            echo "release tag appeared during publication (HTTP $status); refusing overwrite" >&2
            exit 1
          fi

          anonymous_config="$RUNNER_TEMP/plinth-anonymous-docker"
          install -d -m 0700 "$anonymous_config"
          if ! DOCKER_CONFIG="$anonymous_config" docker pull \
            --platform linux/amd64 "$digest_ref"; then
            echo "digest is not anonymously pullable; make the GHCR package public and rerun" >&2
            exit 1
          fi

          docker buildx imagetools create \
            --tag "$REGISTRY_IMAGE:v$VERSION" \
            --metadata-file /tmp/published-image.json "$digest_ref"
          resolved=$(jq -er '."containerimage.descriptor".digest' \
            /tmp/published-image.json)
          if [[ $resolved != "$DIGEST" ]]; then
            echo "published tag resolved to $resolved, expected $DIGEST" >&2
            exit 1
          fi
          gh attestation verify "oci://$REGISTRY_IMAGE:v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA"

          {
            echo "### Published runtime image"
            echo
            echo "\`$REGISTRY_IMAGE:v$VERSION\`"
            echo
            echo "Preferred immutable reference: \`$digest_ref\`"
          } >> "$GITHUB_STEP_SUMMARY"
