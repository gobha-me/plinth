name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: formatting and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22.12"
          cache-dependency-path: load-harness/go.sum

      - name: Verify load harness
        working-directory: load-harness
        env:
          GOMAXPROCS: "2"
        run: |
          go mod verify
          go test ./...
          go vet ./...

      - name: Install build dependencies and LLVM 21
        env:
          CLANG_VERSION: "21"
        run: |
          set -euo pipefail
          .github/scripts/install-llvm.sh "$CLANG_VERSION"
          sudo apt-get install -y \
            build-essential cmake pkg-config git ca-certificates \
            libpq-dev libjsoncpp-dev libssl-dev zlib1g-dev uuid-dev \
            libargon2-dev nodejs python3-yaml \
            "clang-format-$CLANG_VERSION" "clang-tidy-$CLANG_VERSION" \
            "clang-tools-$CLANG_VERSION"

      - name: Check formatting
        run: tools/format.sh --check

      - name: Check licenses, dependency pins, and SBOM
        run: tools/public_readiness.py

      - name: Verify the Helm deployment contract
        env:
          PLINTH_DEPLOYMENT_TOOLS_DIR: /tmp/plinth-deployment-tools/bin
        run: |
          set -euo pipefail
          .github/scripts/install-deployment-tools.sh contract
          export PATH="$PLINTH_DEPLOYMENT_TOOLS_DIR:$PATH"
          python3 tests/deployment/helm_contract_test.py

      - name: Scan repository and history for secrets
        run: .github/scripts/run-gitleaks.sh

      - name: Scan dependencies for known vulnerabilities
        run: .github/scripts/run-osv.sh

      - name: Check suppression policy and run clang-tidy
        env:
          PROJECT_TIDY_JOBS: "2"
        run: tools/lint.sh

  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc / tests
            cc: gcc
            cxx: g++
            install_llvm: false
          - name: clang-21 / tests
            cc: clang-21
            cxx: clang++-21
            install_llvm: true
            llvm_version: "21"
          # Retain the protected Clang 20 compatibility context.
          - name: clang-20 / tests
            cc: clang-20
            cxx: clang++-20
            install_llvm: true
            llvm_version: "20"
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: plinth
          POSTGRES_PASSWORD: plinth
          POSTGRES_DB: plinth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plinth -d plinth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install matrix LLVM
        if: ${{ matrix.install_llvm }}
        env:
          CLANG_VERSION: ${{ matrix.llvm_version }}
        run: |
          set -euo pipefail
          .github/scripts/install-llvm.sh "$CLANG_VERSION"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config git ca-certificates \
            libpq-dev libjsoncpp-dev libssl-dev zlib1g-dev uuid-dev \
            libargon2-dev nodejs

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        env:
          PLINTH_PG_HOST: 127.0.0.1
          PLINTH_PG_PORT: "5432"
          PLINTH_PG_USER: plinth
          PLINTH_PG_PASSWORD: plinth
          PLINTH_PG_DATABASE: plinth_test
        run: ctest --test-dir build --output-on-failure --parallel 1

      - name: Check version command
        run: ./build/plinth --version

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ matrix.cc == 'gcc' }}
        with:
          node-version: "22.23.2"

      - name: Exercise packaged shell in a production browser
        if: ${{ matrix.cc == 'gcc' }}
        env:
          PLINTH_PG_HOST: 127.0.0.1
          PLINTH_PG_PORT: "5432"
          PLINTH_PG_USER: plinth
          PLINTH_PG_PASSWORD: plinth
          PLINTH_PG_DATABASE: plinth_test
        run: |
          sudo apt-get install -y postgresql-client
          npm ci --prefix tests/browser
          (cd tests/browser && npx playwright install --with-deps chromium)
          npm run test:transport --prefix tests/browser
          npm run test:launcher --prefix tests/browser
          npm run test:launcher-browser --prefix tests/browser
          python3 tests/browser/process_cleanup_test.py
          python3 tests/browser/run-production.py --binary build/plinth --realtime
          python3 tests/browser/run-production.py --binary build/plinth --upgrade-cache
          python3 tests/browser/run-bundled-upgrade.py --binary build/plinth

  asan-ubsan:
    name: clang-${{ matrix.llvm_version }} / ASan+UBSan
    strategy:
      fail-fast: false
      matrix:
        # Clang 20 remains a protected compatibility lane during adoption.
        llvm_version: ["20", "21"]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: plinth
          POSTGRES_PASSWORD: plinth
          POSTGRES_DB: plinth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plinth -d plinth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install build dependencies and matrix LLVM
        env:
          CLANG_VERSION: ${{ matrix.llvm_version }}
        run: |
          set -euo pipefail
          .github/scripts/install-llvm.sh "$CLANG_VERSION"
          sudo apt-get install -y \
            build-essential cmake pkg-config git ca-certificates \
            libpq-dev libjsoncpp-dev libssl-dev zlib1g-dev uuid-dev \
            libargon2-dev nodejs "libclang-rt-${CLANG_VERSION}-dev"

      - name: Configure
        env:
          CC: clang-${{ matrix.llvm_version }}
          CXX: clang++-${{ matrix.llvm_version }}
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DPLINTH_SANITIZERS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Focused QuickJS crypto sanitizer corpus
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          ctest --test-dir build -N -R '^plinth_tests_crypto_corpus$' |
            grep -Ex 'Total Tests: 1'
          ctest --test-dir build --output-on-failure -R \
            '^plinth_tests_crypto_corpus$'

      - name: Focused QuickJS crypto numeric sanitizer regression
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          ctest --test-dir build -N -R '^plinth_tests_crypto_numeric_regression$' |
            grep -Ex 'Total Tests: 1'
          ctest --test-dir build --output-on-failure -R \
            '^plinth_tests_crypto_numeric_regression$'

      - name: Test
        env:
          PLINTH_PG_HOST: 127.0.0.1
          PLINTH_PG_PORT: "5432"
          PLINTH_PG_USER: plinth
          PLINTH_PG_PASSWORD: plinth
          PLINTH_PG_DATABASE: plinth_test
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --parallel 1

  tsan:
    name: clang-21 / TSan realtime and lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: plinth
          POSTGRES_PASSWORD: plinth
          POSTGRES_DB: plinth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plinth -d plinth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install build dependencies and LLVM 21 TSan runtime
        run: |
          set -euo pipefail
          .github/scripts/install-llvm.sh 21
          sudo apt-get install -y \
            build-essential cmake pkg-config git ca-certificates \
            libpq-dev libjsoncpp-dev libssl-dev zlib1g-dev uuid-dev \
            libargon2-dev nodejs postgresql-client libclang-rt-21-dev

      - name: Confirm PostgreSQL test fixture is usable
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: plinth
          PGPASSWORD: plinth
          PGDATABASE: plinth_test
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -tAc 'SELECT 1' | grep -qx '1'

      - name: Configure TSan
        env:
          CC: clang-21
          CXX: clang++-21
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DPLINTH_TSAN=ON

      - name: Build
        run: cmake --build build --parallel 2 --target plinth_tests

      # The wrapper checks exit status, positive assertions, and no SKIP.
      # These exact selectors run serially; 10x active-timer exits and short-
      # deadline replay/JS-stress cases are not claimed as TSan-covered here.
      - name: Focused TSan tests
        env:
          PLINTH_PG_HOST: 127.0.0.1
          PLINTH_PG_PORT: "5432"
          PLINTH_PG_USER: plinth
          PLINTH_PG_PASSWORD: plinth
          PLINTH_PG_DATABASE: plinth_test
          TSAN_OPTIONS: halt_on_error=1:exitcode=66
        run: |
          set -euo pipefail
          ctest --test-dir build -N -R '^plinth_tsan_' | grep -Ex 'Total Tests: 7'
          ctest --test-dir build --output-on-failure --parallel 1 -R '^plinth_tsan_'
