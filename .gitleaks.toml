[extend]
useDefault = true

[[allowlists]]
description = "LLVM signing-key checksum, not a credential"
condition = "AND"
paths = ['''^\.github/scripts/install-llvm\.sh$''']
regexes = ['''8b2a587ffd672c4687e7581dad4b2f6c1bb2ad6b480cd9771ba2ff48e0b8c75d''']

[[allowlists]]
description = "RFC 6455 example WebSocket nonce"
condition = "AND"
paths = ['''^tests/kernel/(lifecycle/process_shutdown_test|ws/auth_test)\.cpp$''']
regexes = ['''dGhlIHNhbXBsZSBub25jZQ==''']

[[allowlists]]
description = "RFC 6455 example WebSocket nonce in the ingress protocol fixture"
condition = "AND"
paths = ['''^tests/deployment/ingress_dast_unit_test\.py$''']
regexTarget = "secret"
regexes = ['''^dGhlIHNhbXBsZSBub25jZQ==$''']

[[allowlists]]
description = "Nonfunctional PAT shown in the protocol documentation"
condition = "AND"
paths = ['''^docs/icd/ICD-0\.1\.3-pats\.md$''']
regexes = ['''plinth_aBcDeFgH1234567890abcdef\.\.\.''']

[[allowlists]]
description = "ICD dependency label misclassified as a credential"
condition = "AND"
paths = ['''^docs/icd/ICD-0\.1\.4-groups-rbac\.md$''']
regexes = ['''ICD-0\.1\.3-pats''']

[[allowlists]]
description = "Deterministic CSRF HMAC test vector, not a credential"
condition = "AND"
paths = ['''^tests/kernel/auth/csrf_test\.cpp$''']
regexes = ['''4QiLXgHg5DvZWCPXHWwVyPE0YuvaKX67CSLnZh72wFs''']

[[allowlists]]
description = "Deterministic surface cursor HMAC fingerprint, not a credential"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tests/kernel/frontend/surface_protocol_test\.cpp$''']
regexTarget = "secret"
regexes = ['''^sanADvnIuudZjcwLQI8bj--LzqaiKRooLYrCyYa5WgU$''']

[[allowlists]]
description = "Deterministic admin-default cursor HMAC fingerprint, not a credential"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tests/kernel/frontend/admin_defaults_contract_test\.cpp$''']
regexTarget = "secret"
regexes = ['''^aU8t7ANB_fIOdAVVM2G5uF5eF9LqZryfCh0aw265nnc$''']

[[allowlists]]
description = "Public module SHA256 provenance fixture, not a credential"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tests/browser/groups-admin-production\.mjs$''']
regexTarget = "secret"
regexes = ['''^809e189dcc1df92b8ea873db241be51d55db92de5e5a0cfc7843770936ab9242$''']
